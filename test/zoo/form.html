<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form</title></head>
<body>
  <nav><a href="/">Home</a></nav>
  <main>
    <h1>Search</h1>
    <input id="q" type="text" aria-label="Find a page">
  </main>
  <script>
    // Keyboard-only navigation: nothing to click, Enter is the action.
    document.getElementById('q').onkeydown = (e) => {
      if (e.key === 'Enter') location.assign('/dialog.html')
    }
  </script>
</body></html>
