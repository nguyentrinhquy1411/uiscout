<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Log in</title></head>
<body>
  <main>
    <h1>Log in</h1>
    <form id="f">
      <label>Name <input id="name" type="text"></label>
      <button type="submit">Log in</button>
    </form>
  </main>
  <script>
    document.getElementById('f').onsubmit = (e) => {
      e.preventDefault()
      localStorage.setItem('user', document.getElementById('name').value || 'guest')
      location.assign('/members.html')
    }
  </script>
</body></html>
